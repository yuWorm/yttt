name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag, package version, and changelog
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "yttt"))')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo package version $version." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          head_commit="$(git rev-parse HEAD)"
          if [[ -z "$tag_commit" || "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag $RELEASE_TAG is missing or does not resolve to the checked-out commit." >&2
            exit 1
          fi
          python3 scripts/release_metadata.py \
            --version "$version" \
            --changelog CHANGELOG.md \
            --validate-changelog-only
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  validation:
    name: Validation
    needs: metadata
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.metadata.outputs.ref }}


  macos:
    name: Package macOS DMG
    needs:
      - metadata
      - validation
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Build DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/build-macos-dmg.sh --output "dist/yttt-$VERSION-macos-aarch64.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Package Windows installer
    needs:
      - metadata
      - validation
    runs-on: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        shell: powershell
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: .\scripts\build-windows-installer.ps1 -Output "dist/yttt-$env:VERSION-windows-x86_64-setup.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Package Linux tarball
    needs:
      - metadata
      - validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            g++ \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            pkg-config

      - name: Build Linux tarball
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/build-linux-tar.sh --output "dist/yttt-$VERSION-linux-x86_64.tar.gz"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  server:
    name: Package headless Server (${{ matrix.platform }}-${{ matrix.arch }})
    needs:
      - metadata
      - validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-15
            platform: macos
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Build headless Server
        run: cargo build --locked --release -p yttt-server
      - name: Package Server binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/yttt-server "dist/yttt-server-$VERSION-$PLATFORM-$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: release-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/yttt-server-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - validation
      - macos
      - windows
      - linux
      - server
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/release_metadata.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --dist dist \
            --notes-output release-notes.md \
            --manifest-output dist/update.json

      - name: Generate checksums
        working-directory: dist
        run: sha256sum yttt-* update.json > SHA256SUMS

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
