name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      validated: ${{ steps.build.outputs.result }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag, package version, and changelog
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "yttt"))')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo package version $version." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          head_commit="$(git rev-parse HEAD)"
          if [[ -z "$tag_commit" || "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag $RELEASE_TAG is missing or does not resolve to the checked-out commit." >&2
            exit 1
          fi
          python3 scripts/release_metadata.py \
            --version "$version" \
            --changelog CHANGELOG.md \
            --validate-changelog-only
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$head_commit" >> "$GITHUB_OUTPUT"

      - name: Find successful default-branch Build for this exact commit
        id: build
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'build.yml',
              head_sha: process.env.RELEASE_SHA,
              branch: context.payload.repository.default_branch,
              event: 'push', status: 'success', per_page: 1,
            });
            const run = data.workflow_runs.find(run =>
              run.head_sha === process.env.RELEASE_SHA &&
              run.head_repository?.full_name === `${owner}/${repo}` &&
              run.conclusion === 'success'
            );
            core.info(run ? `Reusing successful Build: ${run.html_url}` : 'Running full release validation');
            return Boolean(run);

  validation:
    name: Validation
    needs: metadata
    if: needs.metadata.outputs.validated != 'true'
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.metadata.outputs.ref }}

  validation-gate:
    name: Require validated release commit
    if: ${{ !cancelled() }}
    needs: [metadata, validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require fresh validation or exact-commit Build success
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          REUSED_BUILD: ${{ needs.metadata.outputs.validated }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$METADATA_RESULT" = success
          if [ "$REUSED_BUILD" = true ]; then
            test "$VALIDATION_RESULT" = skipped
          else
            test "$VALIDATION_RESULT" = success
          fi


  macos:
    name: Package macOS DMG
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    runs-on: macos-26
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Restore bounded Rust compiler cache
        uses: ./.github/actions/rust-cache

      - name: Build DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/build-macos-dmg.sh --output "dist/yttt-$VERSION-macos-aarch64.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          retention-days: 1
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Package Windows installer
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    runs-on: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Restore bounded Rust compiler cache
        uses: ./.github/actions/rust-cache

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        shell: powershell
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: .\scripts\build-windows-installer.ps1 -Output "dist/yttt-$env:VERSION-windows-x86_64-setup.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          retention-days: 1
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Package Linux tarball
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-gnu

      - name: Restore bounded Rust compiler cache
        uses: ./.github/actions/rust-cache

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            g++ \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            pkg-config

      - name: Build Linux tarball
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/build-linux-tar.sh --output "dist/yttt-$VERSION-linux-x86_64.tar.gz"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          retention-days: 1
          path: dist/*.tar.gz
          if-no-files-found: error

  server:
    name: Package headless Server (${{ matrix.platform }}-${{ matrix.arch }})
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-26
            platform: macos
            arch: aarch64
          - runner: macos-26-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore bounded Rust compiler cache
        uses: ./.github/actions/rust-cache
      - name: Build headless Server
        run: cargo build --locked --release -p yttt-server
      - name: Package Server binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/yttt-server "dist/yttt-server-$VERSION-$PLATFORM-$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: release-server-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 1
          path: dist/yttt-server-*
          if-no-files-found: error

  relay:
    name: Build relay service (linux-${{ matrix.arch }})
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            docker: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            docker: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      # Static binaries: relay nodes download them onto any Linux server, and
      # the control-plane image runs on a bare Debian base.
      - name: Activate pinned Rust toolchain with the musl target
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.arch }}-unknown-linux-musl"
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Restore bounded Rust compiler cache
        uses: ./.github/actions/rust-cache
      - name: Build relay node and control plane
        env:
          CC: musl-gcc
        run: |
          cargo build --locked --release -p yttt-relay -p yttt-control \
            --target "${{ matrix.arch }}-unknown-linux-musl"
      - name: Package static binaries
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          out="target/$ARCH-unknown-linux-musl/release"
          strip "$out/yttt-relay" "$out/yttt-control"
          # x86_64 musl links static-pie, which `file` names differently.
          file "$out/yttt-relay" "$out/yttt-control" | grep -Ev "statically linked|static-pie linked" && exit 1 || true
          mkdir -p dist
          cp "$out/yttt-relay" "dist/yttt-relay-$VERSION-linux-$ARCH"
          cp "$out/yttt-control" "dist/yttt-control-$VERSION-linux-$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: release-relay-${{ matrix.arch }}
          retention-days: 1
          path: dist/yttt-*
          if-no-files-found: error

  console:
    name: Build relay web console
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' }}
    needs:
      - metadata
      - validation-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - name: Build console
        working-directory: web/control-console
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: image-console
          retention-days: 1
          path: web/control-console/dist
          if-no-files-found: error
      # The same console as a release asset, for installing without Docker.
      - name: Package console
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release
          tar -czf "release/yttt-control-web-$VERSION.tar.gz" -C web/control-console/dist .
      - uses: actions/upload-artifact@v7
        with:
          name: release-console
          retention-days: 1
          path: release
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: ${{ !cancelled() && needs.validation-gate.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.server.result == 'success' && needs.relay.result == 'success' && needs.console.result == 'success' }}
    needs:
      - metadata
      - validation-gate
      - macos
      - windows
      - linux
      - server
      - relay
      - console
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/release_metadata.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --dist dist \
            --notes-output release-notes.md \
            --manifest-output dist/update.json

      - name: Add the control plane installer
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          sed "s/__VERSION__/$VERSION/g" packaging/relay/install-control.sh > dist/install-control.sh
          ! grep -q __VERSION__ dist/install-control.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum yttt-* update.json install-control.sh > SHA256SUMS

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

  image:
    name: Publish relay service image to GHCR
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs:
      - metadata
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Download relay binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-relay-*
          path: staging
          merge-multiple: true
      - name: Download console
        uses: actions/download-artifact@v8
        with:
          name: image-console
          path: packaging/relay/image/web
      - name: Lay out the image context
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          context=packaging/relay/image
          mkdir -p "$context/bin"
          for pair in x86_64:amd64 aarch64:arm64; do
            arch="${pair%%:*}" docker="${pair##*:}"
            install -m 755 "staging/yttt-control-$VERSION-linux-$arch" "$context/control-$docker"
            install -m 755 "staging/yttt-relay-$VERSION-linux-$arch" "$context/relay-$docker"
            # Names the node install script asks for.
            install -m 755 "staging/yttt-relay-$VERSION-linux-$arch" "$context/bin/yttt-relay-linux-$arch"
          done
          (cd "$context/bin" && sha256sum yttt-relay-linux-* > SHA256SUMS)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yttt-relay" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packaging/relay
          file: packaging/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=yttt relay control plane, web console and relay node

  cleanup:
    name: Delete published staging artifacts
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs:
      - publish
      - image
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete only this run's release staging artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            for (const artifact of artifacts.filter(a => a.name.startsWith('release-') || a.name.startsWith('image-'))) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted staging artifact ${artifact.name}; Release assets are unchanged`);
            }
