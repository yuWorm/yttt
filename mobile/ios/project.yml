# The yttt mobile client for iOS. Generate the Xcode project with:
#   scripts/mobile/build-ios.sh && (cd mobile/ios && xcodegen generate)
name: Yttt
options:
  bundleIdPrefix: dev.yttt
  # The app's strings are Chinese; system ones (Cancel, Paste) follow.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  # The file editor (MIT).
  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: 0.5.2
  # Tree-sitter grammars and queries for Runestone (MIT).
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: 0.1.10
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The core is built for arm64 simulators only (scripts/mobile/build-ios.sh);
    # Release builds every architecture unless told otherwise.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Yttt:
    type: application
    platform: iOS
    sources:
      - Yttt
      - path: ../../target/mobile/ios/swift
        group: Generated
      # JetBrains Mono (OFL), shared with Android: ../fonts/README.md.
      - path: ../fonts
        buildPhase: resources
        excludes: ["README.md"]
    dependencies:
      - package: SwiftTerm
      - package: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterRustRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTypeScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTSXRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterGoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCPPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSharpRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRubyRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPHPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterLuaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTOMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSQLRunestone
      - framework: ../../target/mobile/ios/YtttMobileCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: Yttt/Info.plist
      properties:
        CFBundleDisplayName: yttt
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: yttt connects directly to your computer on the local network.
        NSCameraUsageDescription: yttt scans the pairing QR code your computer shows.
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yttt.yai
        MARKETING_VERSION: 0.1.0
        # Assets.xcassets, generated by scripts/build-mobile-icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        OTHER_LDFLAGS: ["-lc++"]
  YtttTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YtttTests
      - path: ../fixtures/vt-fixtures.json
        buildPhase: resources
      # The home screen's sorting, tested on its own with the core's types.
      - Yttt/HomeSections.swift
      - Yttt/LinkBannerText.swift
      - Yttt/ProjectPage.swift
      - Yttt/FileTree.swift
      - Yttt/SecretStore.swift
      - Yttt/PairingScan.swift
      - Yttt/HostList.swift
      - Yttt/Automation.swift
      - Yttt/AppearanceSettings.swift
      - path: ../../target/mobile/ios/swift
        group: Generated
    dependencies:
      - package: SwiftTerm
      - framework: ../../target/mobile/ios/YtttMobileCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
      # Hosted by the app: the Keychain needs an app's entitlements.
      - target: Yttt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["-lc++"]
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yttt.app/Yttt"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Taps through the app against a running spike Host; its own scheme, as it
  # needs one: TEST_RUNNER_YTTT_PAIR_CODE=<code> xcodebuild test -scheme YtttUITests
  YtttUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YtttUITests
    dependencies:
      - target: Yttt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yttt
schemes:
  YtttUITests:
    build:
      targets:
        Yttt: all
        YtttUITests: [test]
    test:
      targets:
        - YtttUITests
  Yttt:
    build:
      targets:
        Yttt: all
        YtttTests: [test]
    test:
      targets:
        - YtttTests
