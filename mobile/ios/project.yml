# Spike app for the yttt mobile client. Generate the Xcode project with:
#   scripts/mobile/build-ios.sh && (cd mobile/ios && xcodegen generate)
name: YtttSpike
options:
  bundleIdPrefix: dev.yttt
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  # The file editor (MIT).
  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: 0.5.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  YtttSpike:
    type: application
    platform: iOS
    sources:
      - YtttSpike
      - path: ../../target/mobile/ios/swift
        group: Generated
    dependencies:
      - package: SwiftTerm
      - package: Runestone
      - framework: ../../target/mobile/ios/YtttMobileCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: YtttSpike/Info.plist
      properties:
        CFBundleDisplayName: yttt spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: yttt connects directly to your computer on the local network.
        NSCameraUsageDescription: yttt scans the pairing QR code your computer shows.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yttt.spike
        OTHER_LDFLAGS: ["-lc++"]
  YtttSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YtttSpikeTests
      - path: ../fixtures/vt-fixtures.json
        buildPhase: resources
      # The home screen's sorting, tested on its own with the core's types.
      - YtttSpike/HomeSections.swift
      - YtttSpike/ProjectPage.swift
      - YtttSpike/FileTree.swift
      - YtttSpike/SecretStore.swift
      - YtttSpike/PairingScan.swift
      - path: ../../target/mobile/ios/swift
        group: Generated
    dependencies:
      - package: SwiftTerm
      - framework: ../../target/mobile/ios/YtttMobileCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
      # Hosted by the app: the Keychain needs an app's entitlements.
      - target: YtttSpike
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["-lc++"]
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YtttSpike.app/YtttSpike"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  YtttSpike:
    build:
      targets:
        YtttSpike: all
        YtttSpikeTests: [test]
    test:
      targets:
        - YtttSpikeTests
