[workspace]
members = [
    ".",
    "crates/yttt-agent-core",
    "crates/yttt-agent-providers",
    "crates/yttt-agent-runtime",
    "crates/yttt-client-core",
    "crates/yttt-host",
    "crates/yttt-protocol",
    "crates/yttt-project-core",
    "crates/yttt-transport-local",
    "crates/yttt-core",
    "crates/yttt-terminal-core",
    "crates/yttt-ssh",
    "crates/yttt-terminal",
    "crates/yttt-ui",
]
exclude = ["vendor/gpui-component", "vendor/gpui-markdown-editor"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[package]
name = "yttt"
version.workspace = true
edition.workspace = true
default-run = "yttt"

[features]
perf-metrics = ["yttt-terminal/perf-metrics"]

[dependencies]
anyhow = "1"
base64 = "0.22"
dunce = "1"
futures-lite = "2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui-component = { path = "vendor/gpui-component/crates/ui", features = ["tree-sitter-languages"] }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" }
gpui-markdown-editor = { path = "vendor/gpui-markdown-editor" }
ignore = "0.4"
yttt-agent-core = { path = "crates/yttt-agent-core" }
yttt-agent-providers = { path = "crates/yttt-agent-providers" }
yttt-agent-runtime = { path = "crates/yttt-agent-runtime" }
zeroize = "1"
notify = "7.0.0"
notify-rust = "4.18"
nucleo-matcher = "0.3.1"
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
tree-sitter = "0.26"
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-fish = "3.6.0"
sha2 = "0.10"
tree-sitter-gdscript = "6.1.0"
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.23.4"
tree-sitter-swift = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-zig = "1.1.2"
tree-sitter-toml-ng = "0.7"
yttt-core = { path = "crates/yttt-core" }
flume = "0.12"
yttt-host = { path = "crates/yttt-host" }
yttt-client-core = { path = "crates/yttt-client-core" }
yttt-protocol = { path = "crates/yttt-protocol" }
yttt-project-core = { path = "crates/yttt-project-core" }
yttt-transport-local = { path = "crates/yttt-transport-local" }
yttt-terminal = { path = "crates/yttt-terminal" }
yttt-ui = { path = "crates/yttt-ui" }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
shell-words = "1.1"
sysinfo = "0.31.4"
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"
features = ["font-kit", "runtime_shaders"]

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe"
features = ["wayland", "x11"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["test-support"] }
