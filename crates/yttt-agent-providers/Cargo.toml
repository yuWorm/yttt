[package]
name = "yttt-agent-providers"
version.workspace = true
edition.workspace = true
description = "Built-in agent provider adapters for yttt"
license = "MIT"

[dependencies]
yttt-agent-core = { path = "../yttt-agent-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
