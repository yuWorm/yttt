[package]
name = "yttt-server"
version.workspace = true
edition.workspace = true

[dependencies]
fs2 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
yttt-client-core = { path = "../yttt-client-core" }
yttt-core = { path = "../yttt-core" }
yttt-host = { path = "../yttt-host" }
yttt-protocol = { path = "../yttt-protocol" }
yttt-transport-local = { path = "../yttt-transport-local" }
yttt-transport = { path = "../yttt-transport" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
