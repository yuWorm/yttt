[package]
name = "yttt-ssh"
version.workspace = true
edition.workspace = true

[dependencies]
async-channel = "2.5"
flume = "0.12"
keyring = "4.1.5"
russh = "0.62.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
russh-sftp = "2.3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
yttt-core = { path = "../yttt-core" }
yttt-protocol = { path = "../yttt-protocol" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
