[package]
name = "yttt-agent-runtime"
version.workspace = true
edition.workspace = true
description = "Provider registry and authenticated agent activity runtime"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
yttt-agent-core = { path = "../yttt-agent-core" }
