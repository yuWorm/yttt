[package]
name = "yttt-transport-tls"
version.workspace = true
edition.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
yttt-protocol = { path = "../yttt-protocol" }
yttt-transport = { path = "../yttt-transport" }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
