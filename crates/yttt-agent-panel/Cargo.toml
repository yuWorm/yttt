[package]
name = "yttt-agent-panel"
version.workspace = true
edition.workspace = true
description = "Agent panel UI: composer, streaming thread and tool call cards"
license = "MIT"

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
yttt-ui = { path = "../yttt-ui" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
