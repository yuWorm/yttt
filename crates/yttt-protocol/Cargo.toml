[package]
name = "yttt-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
ciborium = "0.2"
crc32fast = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
yttt-agent-core = { path = "../yttt-agent-core" }
yttt-core = { path = "../yttt-core" }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
