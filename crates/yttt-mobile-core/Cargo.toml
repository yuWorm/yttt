[package]
name = "yttt-mobile-core"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Core link of the yttt iOS and Android Clients, exported through UniFFI"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Logs to stderr when YTTT_LOG is set (a filter, as RUST_LOG); off otherwise.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
uniffi = "=0.31.1"
yttt-agent-core = { path = "../yttt-agent-core" }
yttt-client-core = { path = "../yttt-client-core" }
yttt-core = { path = "../yttt-core" }
yttt-protocol = { path = "../yttt-protocol" }
yttt-transport = { path = "../yttt-transport" }
yttt-transport-iroh = { path = "../yttt-transport-iroh" }

[dev-dependencies]
toml = "0.8"
# The encoder's reference terminal in tests and fixtures; not linked into the
# apps (alacritty does not build for Android).
alacritty_terminal = "0.25.1"
yttt-terminal-core = { path = "../yttt-terminal-core" }
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["signal"] }
yttt-host = { path = "../yttt-host" }
# A self-hosted relay node, for the relay-only test.
yttt-relay = { path = "../yttt-relay" }
