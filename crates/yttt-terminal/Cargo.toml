[package]
name = "yttt-terminal"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "YTTT terminal component for GPUI"


[features]
perf-metrics = ["dep:hdrhistogram", "dep:serde_json"]

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
alacritty_terminal = "0.25.1"
anyhow = "1"
portable-pty = "0.9"
parking_lot = "0.12"
flume = "0.12"
regex = "1"
async-channel = "2"
bytes = "1"
smallvec = "1"
image = "0.25.1"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
hdrhistogram = { version = "7", optional = true }
serde_json = { version = "1", optional = true }
yttt-terminal-core = { path = "../yttt-terminal-core" }
yttt-protocol = { path = "../yttt-protocol" }
yttt-core = { path = "../yttt-core" }


[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
